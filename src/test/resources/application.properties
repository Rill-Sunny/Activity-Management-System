# Integration tests trigger scans explicitly so background work cannot race their fixtures.
ticket-order.expiration.enabled=false
product-order.expiration.enabled=false
reschedule.retention.enabled=false
# Existing MySQL-only integration tests do not start Rabbit listeners or the broker-backed scheduler.
# RabbitMQ reliability tests opt back in to the real broker explicitly.
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
outbox.relay.initial-delay-ms=3600000
outbox.relay.scan-delay-ms=3600000
qualification.after-sale.retry-initial-delay-ms=3600000
qualification.after-sale.retry-delay-ms=3600000

cancellation.worker.enabled=false

# Deterministic trace assertions in isolated tests only.
management.tracing.sampling.probability=1.0
