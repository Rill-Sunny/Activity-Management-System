server:
  port: 8080
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: false
  rabbitmq:
    host: rabbitmq
    username: ${RABBITMQ_USERNAME}
  data:
    redis:
      host: redis
ticket-refund:
  time-zone: Asia/Shanghai
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,rabbit
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: http://tempo:4318/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ticket.payment: true
        product.payment: true
        ticket.refund: true
        mq.consume: true
    tags:
      application: limited-activities-system
      instance: ${INSTANCE_ID}
logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        "[@timestamp]": timestamp
      add:
        service: limited-activities-system
        instance: ${INSTANCE_ID}
  pattern:
    level: "%5p [instance=${INSTANCE_ID} requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-}]"
observability:
  workload:
    enabled: true
