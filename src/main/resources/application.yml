spring:
  application:
    name: limited-activities-system

  # MySQL 数据库连接
  datasource:
    url: jdbc:mysql://localhost:3306/limit_activity_system?serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # Host process: localhost. Set REDIS_HOST=redis when the application joins this Compose network.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 300ms
      timeout: 500ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      # The durable Outbox W3C carrier owns propagation; automatic template spans would replace its parent.
      observation-enabled: false
    listener:
      simple:
        acknowledge-mode: manual
        # BusinessTelemetry extracts traceparent and creates mq.consume around the complete delivery/ACK.
        observation-enabled: false
        default-requeue-rejected: false
        prefetch: 20
        concurrency: 1
        max-concurrency: 4

  # Flyway 数据库版本管理
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1

    validate-on-migrate: true
    clean-disabled: true

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}

ticket-refund:
  # Match the datasource DATETIME time zone; snapshot database time once before application row locks.
  time-zone: Asia/Shanghai

ticket-order:
  expiration:
    enabled: true
    batch-size: 100
    scan-delay-ms: 5000
    initial-delay-ms: 5000

outbox:
  relay:
    batch-size: 50
    max-attempts: 8
    lease-seconds: 60
    scan-delay-ms: 1000
    initial-delay-ms: 1000
  publisher-confirm-timeout-ms: 10000

messaging:
  consumer:
    max-attempts: 3

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    db:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-}]"
