spring:
  application:
    name: limited-activities-system

  # MySQL 数据库连接
  datasource:
    url: jdbc:mysql://localhost:3306/limit_activity_system?serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway 数据库版本管理
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1

    validate-on-migrate: true
    clean-disabled: true

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}

ticket-refund:
  # Match the datasource DATETIME time zone; snapshot database time once before application row locks.
  time-zone: Asia/Shanghai

ticket-order:
  expiration:
    enabled: true
    batch-size: 100
    scan-delay-ms: 5000
    initial-delay-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    db:
      enabled: true

logging:
  pattern:
    # traceId is reserved for future tracing; no synthetic trace IDs are created.
    level: "%5p [requestId=%X{requestId:-} traceId=%X{traceId:-}]"
