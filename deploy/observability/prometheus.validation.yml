# Fixed for both sides of the Day 27 comparison; the normal deployment remains at 15 seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts/*.yml
scrape_configs:
  - job_name: las-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /run/secrets/metrics-password
    static_configs:
      - targets: [app-a:9091, app-b:9091]
    relabel_configs:
      - source_labels: [__address__]
        regex: '(app-[ab]):9091'
        target_label: instance
        replacement: '$1'
  - job_name: las-rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
