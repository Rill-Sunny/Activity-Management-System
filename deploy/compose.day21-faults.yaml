# Dedicated services for the opt-in Day 21 outage tests. Start with --pull never.
name: las-day21-faults

services:
  redis:
    image: redis:8.10.3
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.1.8-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${DAY21_RABBITMQ_USER:?set DAY21_RABBITMQ_USER in the local env file}
      RABBITMQ_DEFAULT_PASS: ${DAY21_RABBITMQ_PASSWORD:?set DAY21_RABBITMQ_PASSWORD in the local env file}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  redis_data:
  rabbitmq_data:
